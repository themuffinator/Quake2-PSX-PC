# Continuous integration.
#
# Builds the core libraries, the offline tools and the test suites on every
# supported toolchain, then runs the tests.
#
# The client is deliberately NOT built here. It needs SDL3, and fetching and
# compiling SDL3 turns a one-minute job into a ten-minute one for no extra
# coverage of this project's own code. The release workflow builds it.
#
# Nothing here needs a Quake II disc: all seven test suites are self-contained.
# The checks that DO need a disc (verify, textures, audio, reloc) are run
# locally against the developer's own copy and cannot run in CI, which is why
# the unit tests carry the invariants they can.
#
# WARNINGS-AS-ERRORS is on. Worth knowing before the first run: the code has
# been verified warning-clean under clang only. GCC and MSVC each warn about
# things clang does not, so the first run on those may well fail on something
# harmless. That is the check doing its job rather than a broken pipeline —
# fix the warning, do not reach for the switch.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-latest
            cc: gcc
          - name: Linux Clang
            os: ubuntu-latest
            cc: clang
          - name: Windows MSVC
            os: windows-latest
            cc: cl
          - name: macOS Clang
            os: macos-latest
            cc: clang

    steps:
      - uses: actions/checkout@v4
        with:
          # A shallow clone has no tags, so `git describe` would report a bare
          # hash and the version header would lose its tag context.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Set up MSVC
        if: matrix.cc == 'cl'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DQ2PSX_BUILD_CLIENT=OFF
          -DQ2PSX_WERROR=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # Not just "does it run": the version it prints has to be the one in the
      # VERSION file. That chain - file, CMake, generated header, binary - is what
      # the release workflow relies on, and this is where it is checked. The
      # expected line comes from version.py rather than from the file directly, so
      # this also exercises the resolver on all four toolchains.
      - name: Check the reported version matches VERSION
        shell: bash
        run: |
          EXPECTED="$(python scripts/version.py show | head -1)"
          ./build/bin/q2psx-inspect --version | tee reported.txt
          head -1 reported.txt | grep -qxF "$EXPECTED"
          echo "binary and VERSION agree: $EXPECTED"

  # ---------------------------------------------------------------------------
  # The release path is the one path that cannot be debugged in production: a
  # broken script is found while cutting a release, with a half-tagged
  # repository to clean up. So it is tested here, on every change.
  # ---------------------------------------------------------------------------
  tooling:
    name: Release tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The version resolver's collision and ordering checks are about tags,
          # so a clone without them would test nothing.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test the version, changelog, notes and packaging tools
        run: python -m unittest discover -s scripts -p 'test_*.py' -v

      - name: VERSION is well-formed and has not fallen behind the tags
        run: python scripts/version.py check

      - name: The changelog parses and its headings are the ones we use
        run: python scripts/changelog.py check

      # A file called nul.ppm made this repository impossible to clone on
      # Windows -- the checkout failed, not the build -- and nothing said so
      # until a Windows runner tried it. Now it fails here, with the reason.
      - name: Every tracked path can be checked out on Windows
        run: python scripts/check_paths.py

      # Rendering the notes for whatever the next release would be catches a
      # broken template on a pull request rather than mid-release.
      - name: The next release's notes render
        run: |
          python scripts/version.py show
          python scripts/release_notes.py --version "$(cat VERSION)" --commit "${{ github.sha }}"
